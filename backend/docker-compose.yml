services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: centre
      POSTGRES_PASSWORD: centre
      POSTGRES_DB: centre_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centre"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: centre
      POSTGRES_PASSWORD: centre
      POSTGRES_DB: centre_test
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
