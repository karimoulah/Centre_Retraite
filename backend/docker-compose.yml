services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: centre
      POSTGRES_PASSWORD: centre
      POSTGRES_DB: centre_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centre"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: centre
      POSTGRES_PASSWORD: centre
      POSTGRES_DB: centre_test
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
  # `docker compose --profile app up`: API and worker in their own containers (the worker sends the e-mails).
  api:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://centre:centre@postgres:5432/centre_dev
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    profiles: [app]
    build: .
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://centre:centre@postgres:5432/centre_dev
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    depends_on: [api]
volumes:
  pgdata:
