name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env:
      # Payload needs a secret and a database URL at build time; no database is reached.
      PAYLOAD_SECRET: ci-only-secret
      DATABASE_URI: postgresql://centre:centre@localhost:5432/centre_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults: { run: { working-directory: frontend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: centre, POSTGRES_PASSWORD: centre, POSTGRES_DB: centre_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U centre" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: true
      API_MODE: mock
      PAYLOAD_SECRET: ci-only-secret
      DATABASE_URI: postgresql://centre:centre@localhost:5432/centre_test
      NEXT_PUBLIC_SITE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }
